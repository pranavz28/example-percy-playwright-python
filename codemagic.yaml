workflows:
  percy-ci-test:
    name: Percy CI test
    max_build_duration: 30
    environment:
      node: 20
      vars:
        PERCY_PARALLEL_TOTAL: "-1"
    scripts:
      - name: Install deps
        script: |
          npm ci --no-audit --no-fund
      - name: Percy snapshot
        script: |
          npx percy snapshot ./site
