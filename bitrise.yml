---
format_version: '17'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: standard

trigger_map:
  - push_branch: per-7828-bitrise
    workflow: percy-ci-test

workflows:
  percy-ci-test:
    steps:
      - activate-ssh-key@4: {}
      - git-clone@8: {}
      - script@1:
          title: Percy snapshot
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -eo pipefail
                npm ci --no-audit --no-fund
                npx percy upload ./shots || true
